# On every push to the default branch, the Settings app (https://probot.github.io/apps/settings/) syncs this file to GitHub.
# Every section is optional. When a list section is present, the app deletes every entry on GitHub that the list does not contain.

# When `_extends` is set to another repository of the same owner, this file inherits that repository's settings and overrides only the keys written here.
# _extends: .github

repository:
  # Keys match the body of https://docs.github.com/en/rest/repos/repos#update-a-repository.

  # When `name` differs from the current name, the sync renames the repository.
  # name: repo-name
  # description: description of repo
  # homepage: https://example.github.io/
  # Takes one comma-separated string, not a list.
  # topics: github, probot

  private: false
  # Accepts `public` or `private`.
  visibility: public
  is_template: false
  # Once archived, the repository accepts no push, so a sync can never set this back to `false`.
  archived: false

  has_issues: true
  # When the organization has disabled projects, `true` makes the API return an error.
  has_projects: false
  has_wiki: false
  has_discussions: false
  has_pull_requests: true
  # Accepts `all` or `collaborators_only`.
  pull_request_creation_policy: all

  default_branch: main
  # Governs forking of a private repository.
  allow_forking: true
  web_commit_signoff_required: false

  allow_squash_merge: false
  # Accepts `PR_TITLE` or `COMMIT_OR_PR_TITLE`. When `squash_merge_commit_message` is set, this key is required.
  squash_merge_commit_title: COMMIT_OR_PR_TITLE
  # Accepts `PR_BODY`, `COMMIT_MESSAGES`, or `BLANK`.
  squash_merge_commit_message: COMMIT_MESSAGES
  allow_merge_commit: true
  # Accepts `PR_TITLE` or `MERGE_MESSAGE`. When `merge_commit_message` is set, this key is required.
  merge_commit_title: MERGE_MESSAGE
  # Accepts `PR_BODY`, `PR_TITLE`, or `BLANK`.
  merge_commit_message: PR_TITLE
  allow_rebase_merge: false
  allow_auto_merge: true
  delete_branch_on_merge: true
  # When a pull request is behind its base branch, `true` offers the update even if the branch is not required to be up to date.
  allow_update_branch: true

  # Every `status` accepts `enabled` or `disabled`. Push protection requires secret scanning.
  security_and_analysis:
    secret_scanning:
      status: enabled
    secret_scanning_push_protection:
      status: enabled
    # The keys below require a GitHub Code Security or GitHub Secret Protection license.
    # advanced_security:
    #   status: enabled
    # code_security:
    #   status: enabled
    # secret_scanning_ai_detection:
    #   status: enabled
    # secret_scanning_non_provider_patterns:
    #   status: enabled
    # secret_scanning_delegated_alert_dismissal:
    #   status: enabled
    # secret_scanning_delegated_bypass:
    #   status: enabled
    # secret_scanning_delegated_bypass_options:
    #   reviewers:
    #     - reviewer_id: 1
    #       # Accepts `TEAM` or `ROLE`.
    #       reviewer_type: TEAM
    #       # Accepts `ALWAYS` or `EXEMPT`.
    #       mode: ALWAYS

  # `enable_vulnerability_alerts` toggles Dependabot alerts. `enable_automated_security_fixes` toggles Dependabot security updates.
  enable_automated_security_fixes: false
  enable_vulnerability_alerts: true

# labels:
#   - name: bug
#     # When the color starts with `#`, quote it.
#     color: '#CC0000'
#     description: An issue with the system.
#     # `new_name` renames the label.
#     new_name: defect

# milestones:
#   - title: milestone-title
#     description: milestone-description
#     # Accepts `open` or `closed`.
#     state: open

# See https://docs.github.com/en/rest/collaborators/collaborators#add-a-repository-collaborator for the options.
# collaborators:
#   - username: bkeepers
#     # Accepts `pull`, `triage`, `push`, `maintain`, or `admin`. On a personal repository the value is ignored.
#     permission: push

# Teams apply to organization-owned repositories only.
# See https://docs.github.com/en/rest/teams/teams#add-or-update-team-repository-permissions for the options.
# teams:
#   - name: core
#     # Accepts `pull`, `triage`, `push`, `maintain`, or `admin`.
#     permission: admin

# See https://docs.github.com/en/rest/deployments/environments#create-or-update-an-environment for the options.
environments:
  - name: github-marketplace
    # Delays each job by this many minutes, 0 to 43200.
    # wait_timer: 0
    # Lists up to six users or teams. Each job waits for an approval from one of them.
    # reviewers:
    #   - id: 1
    #     type: User
    #   - id: 2
    #     type: Team
    # Accepts `protected_branches: true` or a `custom_branches` list of branch and tag patterns. When omitted, every branch may deploy.
    deployment_branch_policy:
      # protected_branches: true
      custom_branches:
        - name: v*
          type: tag

# See https://docs.github.com/en/rest/repos/rules#create-a-repository-ruleset for the properties.
rulesets:
  - name: Main
    # Accepts `branch`, `tag`, or `push`.
    target: branch
    # Accepts `active`, `disabled`, or `evaluate`. `evaluate` requires GitHub Enterprise.
    enforcement: active
    conditions:
      ref_name:
        exclude: []
        # Accepts ref patterns, `~DEFAULT_BRANCH`, and `~ALL`.
        include:
          - ~DEFAULT_BRANCH
    rules:
      - type: deletion
      - type: non_fast_forward
      - type: code_scanning
        parameters:
          code_scanning_tools:
            - tool: CodeQL
              # Accepts `none`, `critical`, `high_or_higher`, `medium_or_higher`, or `all`.
              security_alerts_threshold: high_or_higher
              # Accepts `none`, `errors`, `errors_and_warnings`, or `all`.
              alerts_threshold: errors
      - type: required_status_checks
        parameters:
          strict_required_status_checks_policy: true
          do_not_enforce_on_create: false
          required_status_checks:
            - context: All done
              integration_id: 15368
            # The codecov checks time out often, which would block merges if they were required.
            # - context: codecov/patch
            #   integration_id: 254
            # - context: codecov/project
            #   integration_id: 254
            - context: Format
              integration_id: 15368
            - context: Lint
              integration_id: 15368
            - context: Verify changelog selection
              integration_id: 15368
      - type: pull_request
        parameters:
          required_approving_review_count: 0
          dismiss_stale_reviews_on_push: true
          required_reviewers: []
          # - reviewer:
          #     id: 1
          #     type: Team
          #   file_patterns:
          #     - "src/**"
          #   minimum_approvals: 1
          # dismissal_restriction:
          #   enabled: true
          #   allowed_actors:
          #     - id: 5
          #       # Accepts `User`, `Team`, `IntegrationInstallation`, or `RepositoryRole`.
          #       type: RepositoryRole
          require_code_owner_review: false
          require_last_push_approval: false
          required_review_thread_resolution: false
          # GitHub defaults this key to `true` on every ruleset, and the REST API does not document it as an input. It is in public preview.
          require_extra_approval_for_unattributed_changes: false
          # Accepts any of `merge`, `squash`, and `rebase`.
          allowed_merge_methods:
            - merge
      # GitHub offers these further rule types.
      # - type: creation
      # - type: update
      #   parameters:
      #     update_allows_fetch_and_merge: true
      # - type: required_linear_history
      # - type: required_signatures
      # - type: required_deployments
      #   parameters:
      #     required_deployment_environments:
      #       - github-marketplace
      # - type: merge_queue
      #   parameters:
      #     check_response_timeout_minutes: 60
      #     # Accepts `ALLGREEN` or `HEADGREEN`.
      #     grouping_strategy: ALLGREEN
      #     max_entries_to_build: 5
      #     max_entries_to_merge: 5
      #     # Accepts `MERGE`, `SQUASH`, or `REBASE`.
      #     merge_method: MERGE
      #     min_entries_to_merge: 1
      #     min_entries_to_merge_wait_minutes: 5
      # `commit_author_email_pattern`, `committer_email_pattern`, `branch_name_pattern`, and `tag_name_pattern` take the same parameters as `commit_message_pattern`.
      # - type: commit_message_pattern
      #   parameters:
      #     name: ""
      #     negate: false
      #     # Accepts `starts_with`, `ends_with`, `contains`, or `regex`.
      #     operator: regex
      #     pattern: ""
      # - type: file_path_restriction
      #   parameters:
      #     restricted_file_paths: []
      # - type: file_extension_restriction
      #   parameters:
      #     restricted_file_extensions: []
      # - type: max_file_path_length
      #   parameters:
      #     max_file_path_length: 255
      # - type: max_file_size
      #   parameters:
      #     # The limit is in megabytes and exempts Git LFS objects.
      #     max_file_size: 100
      # - type: workflows
      #   parameters:
      #     do_not_enforce_on_create: false
      #     workflows:
      #       - path: .github/workflows/ci.yml
      #         repository_id: 1
      #         ref: main
      # - type: copilot_code_review
      #   parameters:
      #     review_draft_pull_requests: false
      #     review_on_push: false
      # - type: license_compliance_scanning

    bypass_actors:
      # `actor_type` accepts `Integration`, `OrganizationAdmin`, `RepositoryRole`, `Team`, `DeployKey`, or `User`.
      # `bypass_mode` accepts `always`, `pull_request`, or `exempt`.
      # Repository role 5 is Admin.
      - actor_id: 5
        actor_type: RepositoryRole
        bypass_mode: pull_request
